[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirects for SPA-style routing (optional, Astro handles this)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for better security and caching
# Cache-Control on HTML lets prefetched pages be reused on nav = instant feel
# (_astro/* and /fonts/* override with their own Cache-Control below)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
